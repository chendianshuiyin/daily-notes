name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and upload to"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 package
    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Install Visual Studio ATL
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $process = Start-Process $installer -ArgumentList @(
            "modify", "--installPath", "`"$installPath`"",
            "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC",
            "--quiet", "--norestart"
          ) -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) {
            throw "Visual Studio ATL installation failed with exit code $($process.ExitCode)."
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $asset = "daily-notes-${{ inputs.release_tag }}-windows-x64.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "$asset.sha256"

      - name: Upload Windows asset to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" `
            "daily-notes-${{ inputs.release_tag }}-windows-x64.zip" `
            "daily-notes-${{ inputs.release_tag }}-windows-x64.zip.sha256" `
            --clobber
