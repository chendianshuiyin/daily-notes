name: Build Linux Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and upload to"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x64 package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev zip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Linux release
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release

      - name: Package Linux release
        shell: bash
        run: |
          asset="daily-notes-${{ inputs.release_tag }}-linux-x64.zip"
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/$asset" .
          cd "$GITHUB_WORKSPACE"
          sha256sum "$asset" | tee "$asset.sha256"

      - name: Upload Linux asset to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            "daily-notes-${{ inputs.release_tag }}-linux-x64.zip" \
            "daily-notes-${{ inputs.release_tag }}-linux-x64.zip.sha256" \
            --clobber
